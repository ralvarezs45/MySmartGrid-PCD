syntax = "proto3";

option java_package = "grpc";
option java_outer_classname = "ActualizarPreciosProto";

service ActualizarPrecios {
	rpc actualizarPrecios (ActualizarRequest ) returns (stream ActualizarReply);
}

message ActualizarRequest {
	string NIF = 1;
	string Apellidos = 2;
	string IP = 3;
}

message ActualizarReply {
	string tipoDemanda = 1;
	double precio = 2;
}
